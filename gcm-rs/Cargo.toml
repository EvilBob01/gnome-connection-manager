[package]
name = "gcm-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Tabbed connection manager (SSH, Telnet, Serial, RDP, VNC) for Linux and Windows"
license = "GPL-3.0-or-later"

[[bin]]
name = "gcm"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
arboard = "3"
egui_extras = "0.36"
rfd = "0.17"
egui_dock = "0.21"
alacritty_terminal = "0.26"
portable-pty = "0.9"
serialport = { version = "4", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
dirs = "6"
shlex = "1"
anyhow = "1"
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
log = "0.4"
env_logger = "0.11"

[profile.release]
lto = "thin"
strip = true
